name: Splunk App CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch: {}
  schedule:
    # Weekly re-run of main, so it never goes stale unseen against new
    # Splunk, AppInspect and dependency releases. Tag-only jobs skip it.
    - cron: "48 5 * * 2"

permissions:
  pull-requests: write
  actions: write
  checks: write
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          # Build on 3.9: Splunk 10.1 and lower run the add-on on 3.9, and
          # ucc-gen vendors whatever pip resolves for THIS interpreter. Built on
          # 3.11, the package shipped ten 3.10+-only libraries (requests 2.34,
          # protobuf 7, grpcio, opentelemetry 1.44).
          python-version: "3.9"

      - name: Determine version
        id: version
        shell: bash
        run: |
          SHORT_COMMIT_HASH=$(git rev-parse --short HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
          else
            TAG_VERSION="1.0.0"
          fi
          VERSION_WITH_HASH="${TAG_VERSION}+${SHORT_COMMIT_HASH}"
          echo "VERSION_WITH_HASH=${VERSION_WITH_HASH}" >> $GITHUB_OUTPUT
          echo "TAG_VERSION=${TAG_VERSION}" >> $GITHUB_OUTPUT

      - name: Install UCC framework
        run: pip install --upgrade splunk-add-on-ucc-framework

      - name: Build add-on (ucc-gen)
        shell: bash
        run: |
          ucc-gen build --source package --ta-version "${{ steps.version.outputs.VERSION_WITH_HASH }}"
          # python.required = 3.13 comes from meta.supportedPythonVersion in globalConfig.json
          # (generated restmap/inputs stanzas) and package/default/inputs.conf (preserved
          # verbatim). No post-build rewrite.
          # Normalise permissions — AppInspect rejects 775/664. App dirs 755, files 644.
          mkdir -p stage
          cp -r output/TA-airspace-watch stage/TA-airspace-watch
          find stage/TA-airspace-watch -type d -exec chmod 755 {} +
          find stage/TA-airspace-watch -type f -exec chmod 644 {} +

      - name: Vendored libraries support Python 3.9
        shell: bash
        run: |
          pip install --quiet packaging
          python3 - stage/TA-airspace-watch/lib <<'PY'
          import email, pathlib, sys
          from packaging.specifiers import SpecifierSet
          RUNTIME = "3.9"
          lib = pathlib.Path(sys.argv[1])
          metas = sorted(lib.glob("*.dist-info/METADATA"))
          if not metas:
              sys.exit(f"no *.dist-info/METADATA under {lib}: cannot check vendored libraries")
          bad = []
          for meta in metas:
              m = email.message_from_string(meta.read_text(errors="replace"))
              rp = m.get("Requires-Python")
              if rp and not SpecifierSet(rp).contains(RUNTIME, prereleases=True):
                  bad.append(f"{m['Name']} {m['Version']} (Requires-Python {rp})")
          print(f"checked {len(metas)} vendored distributions against Python {RUNTIME}")
          if bad:
              sys.exit("vendored libraries that do not support Python " + RUNTIME + ":\n  " + "\n  ".join(bad))
          PY

      - name: Generate package tarball
        shell: bash
        run: |
          mkdir -p dist
          cd stage
          tar -czf ../dist/TA-airspace-watch-${{ steps.version.outputs.VERSION_WITH_HASH }}.tar.gz TA-airspace-watch/
          cd ..
          ls -la dist/

      - name: Verify package metadata
        # Reads the tarball itself; the expected version comes from the ref and
        # git, independently of the version step.
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="1.0.0"; fi
          export WANT_VERSION="${V}+$(git rev-parse --short HEAD)"
          python3 - dist/*.tar.gz <<'PY'
          import configparser, json, os, sys, tarfile
          want = os.environ["WANT_VERSION"]
          with tarfile.open(sys.argv[1]) as tar:
              raw = tar.extractfile("TA-airspace-watch/default/app.conf").read().decode()
              manifest = json.load(tar.extractfile("TA-airspace-watch/app.manifest"))
          conf = configparser.ConfigParser(interpolation=None, strict=False)
          conf.read_string(raw)
          got = {"launcher.version": conf.get("launcher", "version", fallback=None),
                 "id.version": conf.get("id", "version", fallback=None),
                 "app.manifest": manifest["info"]["id"]["version"]}
          print(got, "build", conf.get("install", "build", fallback=None))
          bad = [k for k, v in got.items() if v != want]
          if bad or not conf.get("install", "build", fallback=""):
              sys.exit(f"package metadata is wrong for {want}: {bad or 'no [install] build'}")
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Upload stage directory for inspection
        uses: actions/upload-artifact@v7
        with:
          name: stage-contents
          path: stage/TA-airspace-watch/

  integration-test:
    name: integration-test (splunk-docker)
    needs: package
    # Dependabot actors get no egress/secrets, so the live Splunk E2E can only
    # fail for them. CLI AppInspect still covers Dependabot PRs.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 10.0 is the oldest Splunk this add-on is tested on; 10.6.0 is current
        # (Postgres-backed KV store, Python 3.13 alongside 3.9).
        splunk: ["10.0", "10.6.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          # Build on 3.9: Splunk 10.1 and lower run the add-on on 3.9, and
          # ucc-gen vendors whatever pip resolves for THIS interpreter. Built on
          # 3.11, the package shipped ten 3.10+-only libraries (requests 2.34,
          # protobuf 7, grpcio, opentelemetry 1.44).
          python-version: "3.9"

      - name: Install UCC framework + pytest
        run: pip install --upgrade splunk-add-on-ucc-framework pytest

      - name: Build add-on into stage/
        shell: bash
        run: |
          ucc-gen build --source package --ta-version 1.0.0
          # python.required comes from globalConfig meta + package/default (see package job); no post-build rewrite.
          rm -rf stage && mkdir -p stage
          cp -r output/TA-airspace-watch stage/TA-airspace-watch
          # The test container's splunk user (a different uid) must read the app
          # and write local/inputs.conf + checkpoints into the bind mount. Wide
          # perms are fine on this throwaway copy — it is never the artefact.
          chmod -R 777 stage/TA-airspace-watch

      - name: Start Splunk + mock receiver (wait for health)
        working-directory: docker
        env:
          SPLUNK_IMAGE_TAG: ${{ matrix.splunk }}
        run: docker compose up -d --wait --wait-timeout 360

      - name: Run integration suite
        env:
          SPLUNK_MGMT_URL: https://127.0.0.1:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: Changeme1!
          SPLUNK_CONTAINER: ta_airspace_watch_splunk
        run: pytest tests/ -v -ra

      - name: Inputs ran on the expected Python
        # 10.2+ must honour python.required = 3.13; 10.0 ignores it and runs 3.9.
        # Read from splunkd's own exec log, not from anything the add-on reports.
        env:
          WANT_313: ${{ matrix.splunk != '10.0' }}
        run: |
          lines=$(docker exec -u splunk ta_airspace_watch_splunk grep -h "ExecProcessor.*exec process: " /opt/splunk/var/log/splunk/splunkd.log | grep "/etc/apps/TA-airspace-watch/bin/" || true)
          printf '%s\n' "$lines" | tail -n 20
          [ -n "$lines" ] || { echo "::error::no ExecProcessor lines for TA-airspace-watch"; exit 1; }
          if [ "$WANT_313" = true ]; then
            if printf '%s\n' "$lines" | grep -v -q "python3\.13"; then echo "::error::an input did not run on python3.13"; exit 1; fi
          elif printf '%s\n' "$lines" | grep -q "python3\.13"; then echo "::error::an input ran on python3.13 on Splunk 10.0"; exit 1; fi

      - name: Splunk logs on failure
        if: failure()
        working-directory: docker
        run: |
          docker compose logs --tail 300 splunk || true
          docker compose logs --tail 50 mock-receiver || true
          docker exec ta_airspace_watch_splunk tail -n 300 /opt/splunk/var/log/splunk/splunkd.log || true

      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose down -v || true

  appinspect:
    name: quality-appinspect
    needs: package
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-cli.yml@main
    with:
      tags: "cloud,future,private_victoria"
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"

  quality-appinspect-api:
    name: quality-appinspect-api
    needs:
      - appinspect
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-api.yml@main
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}

  publish-gh:
    permissions:
      contents: write
    needs:
      - appinspect
      - integration-test
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish.yml@main
