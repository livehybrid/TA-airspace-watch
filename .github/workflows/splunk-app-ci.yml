name: Splunk App CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch: {}
  schedule:
    # Weekly re-run of main, so it never goes stale unseen against new
    # Splunk, AppInspect and dependency releases. Tag-only jobs skip it.
    - cron: "48 5 * * 2"

permissions:
  pull-requests: write
  actions: write
  checks: write
  contents: write

# Cancel a superseded run on the same branch or pull request, so CI never
# spends time on code that has already been replaced. The default branch is
# never cancelled: every push there gets its own complete run, because a
# cancelled run on a branch that deploys or releases can let commits go out
# unchecked (haloclock-app, 13 Oct 2026).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  # The Splunk versions CI tests and Splunkbase lists come from one file in
  # livehybrid/deploy-splunk-app-action (splunk-versions.json).
  splunk-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.v.outputs.matrix }}
    steps:
      - id: v
        uses: livehybrid/deploy-splunk-app-action/splunk-versions@v1

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          # ucc-gen vendors whatever pip resolves for THIS interpreter, so it is
          # the runtime's: every supported Splunk (10.4+) runs the add-on on 3.13.
          python-version: "3.13"

      - name: Determine version
        id: version
        uses: livehybrid/deploy-splunk-app-action/app-version@v1

      - name: Install UCC framework
        run: pip install --upgrade splunk-add-on-ucc-framework

      - name: Build add-on (ucc-gen)
        shell: bash
        run: |
          ucc-gen build --source package --ta-version "${{ steps.version.outputs.VERSION_WITH_HASH }}"
          # python.required = 3.13 comes from meta.supportedPythonVersion in globalConfig.json
          # (generated restmap/inputs stanzas) and package/default/inputs.conf (preserved
          # verbatim). No post-build rewrite.
          mkdir -p stage
          cp -r output/TA-airspace-watch stage/TA-airspace-watch

      - name: Package
        # ucc-gen already stamped the version and its own build number; this
        # checks the bundled certifi, writes the tarball and verifies it.
        uses: livehybrid/deploy-splunk-app-action/app-package@v1
        with:
          app-dir: stage/TA-airspace-watch
          version-with-hash: ${{ steps.version.outputs.VERSION_WITH_HASH }}
          stamp: "false"
          build-scheme: keep
          # Every vendored library must run on 3.13 and no compiled extension may
          # be for another Python (replaces this repo's own Requires-Python step).
          check-vendored-python: require

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Upload stage directory for inspection
        uses: actions/upload-artifact@v7
        with:
          name: stage-contents
          path: stage/TA-airspace-watch/

  integration-test:
    name: integration-test (splunk-docker)
    needs: [package, splunk-versions]
    # Dependabot actors get no egress/secrets, so the live Splunk E2E can only
    # fail for them. CLI AppInspect still covers Dependabot PRs.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        splunk: ${{ fromJSON(needs.splunk-versions.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Free runner disk
        uses: livehybrid/deploy-splunk-app-action/splunk-docker/free-disk@v1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          # Same interpreter as the package job, so the test build vendors the same libraries.
          python-version: "3.13"

      - name: Install UCC framework + pytest
        run: pip install --upgrade splunk-add-on-ucc-framework pytest

      - name: Build add-on into stage/
        shell: bash
        run: |
          ucc-gen build --source package --ta-version 1.0.0
          # python.required comes from globalConfig meta + package/default (see package job); no post-build rewrite.
          rm -r -f stage && mkdir -p stage
          cp -r output/TA-airspace-watch stage/TA-airspace-watch

      - name: Start Splunk + mock receiver (wait for health)
        # The container's splunk user (another uid) writes local/inputs.conf and
        # checkpoints into the bind mount, hence 777 on this throwaway copy.
        uses: livehybrid/deploy-splunk-app-action/splunk-docker/start@v1
        with:
          version: ${{ matrix.splunk }}
          app-dir: stage/TA-airspace-watch
          app-dir-mode: "777"

      - name: Run integration suite
        env:
          REQUIRE_LIVE: "test_live_data"
          SPLUNK_MGMT_URL: https://127.0.0.1:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: Changeme1!
          SPLUNK_CONTAINER: ta_airspace_watch_splunk
        run: pytest tests/ -v -ra

      # Browser checks of the UCC Configuration and Inputs pages, on the same
      # Splunk (after pytest, so neither suite sees the other's inputs).
      - name: Browser tests (Playwright)
        # The shared UCC helpers are installed at e2e/ucc/ucc-helpers.js.
        if: ${{ !cancelled() }}
        uses: livehybrid/deploy-splunk-app-action/playwright@v1
        with:
          artifact-name: e2e-results-${{ matrix.splunk }}
          ucc-helpers: ucc/ucc-helpers.js
        env:
          SPLUNK_WEB_URL: http://localhost:8000
          SPLUNK_MGMT_URL: https://localhost:8089
          SPLUNK_USER: admin
          SPLUNK_PASSWORD: Changeme1!

      - name: Inputs ran on the expected Python
        uses: livehybrid/deploy-splunk-app-action/splunk-docker/expected-python@v1
        with:
          container: ta_airspace_watch_splunk
          app: TA-airspace-watch

      - name: Splunk logs on failure
        if: failure()
        uses: livehybrid/deploy-splunk-app-action/splunk-docker/logs@v1
        with:
          services: splunk mock-receiver
          container: ta_airspace_watch_splunk

      - name: Tear down
        if: always()
        uses: livehybrid/deploy-splunk-app-action/splunk-docker/teardown@v1

  appinspect:
    name: quality-appinspect
    needs: package
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-cli.yml@v1
    with:
      tags: "cloud,future,private_victoria"
    secrets:
      token: "${{ secrets.GITHUB_TOKEN }}"

  quality-appinspect-api:
    name: quality-appinspect-api
    needs:
      - appinspect
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/appinspect-api.yml@v1
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}

  publish-gh:
    permissions:
      contents: write
    needs:
      - appinspect
      - integration-test
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish.yml@v1

  publish-splunkbase:
    # Tag runs only: needs the GitHub release (every CLI gate + integration
    # tests) and Splunk's hosted AppInspect. Uploads stay off unless the repo
    # variable SPLUNKBASE_PUBLISH_ENABLED=true. The compatibility list is the
    # shared splunk-versions.json, the same file the integration matrix uses.
    needs:
      - publish-gh
      - quality-appinspect-api
    permissions:
      contents: read
    uses: livehybrid/deploy-splunk-app-action/.github/workflows/publish-splunkbase.yml@v1
    with:
      app_id: "9301"
    secrets:
      splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
