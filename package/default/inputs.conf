#
# Default modular input stanza for TA-airspace-watch. ucc-gen reads from
# globalConfig.json and rewrites this file at build time; the values here
# are the canonical defaults for a fresh install.
#

# Scheme-level stanza — AppInspect (cloud) requires python.version declared
# at the modular-input scheme level, not only on instance stanzas.
[airspace_watch]
python.version = python3

[airspace_watch://default]
python.version = python3
interval = 5
index = main
sourcetype = airspace:adsb
adsb_host = 192.168.0.58
adsb_port = 8080
adsb_path = /data/aircraft.json
center_lat = 53.8
center_lon = -1.55
radius_nm = 50
request_timeout = 4
disabled = true
