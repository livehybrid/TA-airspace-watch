#
# Default modular-input stanza for TA-airspace-watch. airspace_watch is a
# hand-written splunklib.modularinput script, so ucc-gen preserves this file
# verbatim (it does NOT regenerate inputs.conf from globalConfig.json for it).
# These are the canonical defaults for a fresh install.
#
# Python runtime is pinned to 3.9 (the LTS runtime present from Splunk 9.3
# through 10.x). python.version is the legacy fallback used by Splunk 10.1 and
# lower; python.required pins the Splunk 10.2+ dual runtime to 3.9 only (a
# comma list would let 10.2+ select the highest, i.e. 3.13, defeating the pin).
#

# Scheme-level stanza — AppInspect (cloud) requires python.version declared
# at the modular-input scheme level, not only on instance stanzas.
[airspace_watch]
python.version = python3
python.required = 3.9

[airspace_watch://default]
python.version = python3
python.required = 3.9
interval = 5
index = main
sourcetype = airspace:adsb
adsb_host = 192.168.0.58
adsb_port = 8080
adsb_path = /data/aircraft.json
center_lat = 53.8
center_lon = -1.55
radius_nm = 50
request_timeout = 4
disabled = true
