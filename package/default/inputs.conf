#
# Default modular-input stanza for TA-airspace-watch. airspace_watch is a
# hand-written splunklib.modularinput script, so ucc-gen preserves this file
# verbatim (it does NOT regenerate inputs.conf from globalConfig.json for it).
#
# No input ships here. Receiver and geofence defaults live on the Configuration
# page (ta_airspace_watch_settings.conf, with the same values built into the
# collector when nothing is saved), and the Inputs page fills interval, index
# and sourcetype when an input is created. An earlier [airspace_watch://default]
# stanza showed up as a disabled user input called "default" and its values
# were never needed.
#
# Python runtime: python.required = 3.13 runs this on Python 3.13 on every
# supported Splunk (10.4 and later). CI runs the integration tests on 10.4 and
# the newest 10.6 and checks every input launch used 3.13.
#

# Scheme-level stanza — AppInspect (cloud) requires python.version declared
# at the modular-input scheme level, not only on instance stanzas.
[airspace_watch]
python.version = python3
python.required = 3.13
