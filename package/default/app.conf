#
# Default app metadata. ucc-gen will overwrite the version fields at build
# time from app.manifest. App Inspect requires a [launcher] stanza with a
# version that matches app.manifest.
#

[install]
is_configured = 0
state = enabled
build = 1

[ui]
is_visible = 0
label = AirspaceWatch — Live ADS-B Modular Input

[launcher]
author = Will Searle (livehybrid)
description = Modular input that polls a tar1090/dump1090 ADS-B receiver and emits one Splunk event per aircraft. Powers the AirspaceWatch dashboard.
version = 0.1.0

[package]
check_for_updates = true
id = TA-airspace-watch

[id]
name = TA-airspace-watch
version = 0.1.0

[triggers]
reload.airspace_watch_settings = simple
reload.airspace_watch = simple
