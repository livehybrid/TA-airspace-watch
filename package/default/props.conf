#
# Sourcetype definition for ADS-B events emitted by airspace_watch.py.
# Events are JSON, one per aircraft, with a UTC timestamp in the "time"
# field.
#

[airspace:adsb]
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
NO_BINARY_CHECK = true
TRUNCATE = 5000
TIME_PREFIX = "time":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6NZ
MAX_TIMESTAMP_LOOKAHEAD = 32
category = Custom
description = ADS-B aircraft observations from a tar1090/dump1090 receiver, one event per aircraft per poll cycle.
disabled = false
pulldown_type = true
