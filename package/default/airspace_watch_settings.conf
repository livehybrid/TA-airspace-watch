#
# Default values for the Configuration tab. ucc-gen rewrites this file at
# build time from globalConfig.json; the values here are the initial
# install-time defaults.
#

[receiver]
adsb_host = 192.168.0.58
adsb_port = 8080
adsb_path = /data/aircraft.json
request_timeout = 4

[geofence]
center_lat = 53.8
center_lon = -1.55
radius_nm = 50

[logging]
loglevel = INFO
